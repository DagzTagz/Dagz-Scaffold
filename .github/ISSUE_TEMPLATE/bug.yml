name: Bug
description: Something in the harness, skills, or scorer is wrong.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Unofficial DagzTagz project. Not an xAI product.

        **Do not paste secrets, API keys, tokens, live `runs/` trees, or private diffs.**
        See SECURITY.md. Use a private advisory for vulnerabilities.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behavior. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Commands only. Prefer `--dry-run` and `examples/sample-run`.
      value: |
        python3 harness/score.py examples/sample-run
        python3 harness/score_selftest.py
        python3 harness/ship_gate.py examples/sample-run
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python / grok versions
      placeholder: "Python 3.12.8, grok 1.0.x"
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This report contains no secrets, live runs, or session dumps
          required: true
