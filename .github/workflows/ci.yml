# Offline checks only — no grok, no repository secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: score fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scorer unit tests
        run: python3 harness/test_score.py

      - name: Scorer and ship-gate selftest
        run: python3 harness/score_selftest.py

      - name: Passing fixture
        run: python3 harness/score.py examples/sample-run

      - name: Ship-gate on the passing fixture
        run: python3 harness/ship_gate.py examples/sample-run
